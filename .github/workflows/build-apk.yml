name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle (Vite)
        run: npm run build -- --base=./

      - name: Install Capacitor 7, generate Sugar Pop Android assets & sync project
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/splash-screen@7 @capacitor/status-bar@7
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            node -e 'const fs=require("fs");fs.writeFileSync("capacitor.config.json",JSON.stringify({appId:"com.sugarpop",appName:"Sugar Pop",webDir:"dist",server:{androidScheme:"https"},plugins:{SplashScreen:{launchShowDuration:0,launchAutoHide:false,backgroundColor:"#2F8CF0",androidSplashResourceName:"splash",androidScaleType:"CENTER_CROP",showSpinner:false,splashFullScreen:true,splashImmersive:true}}},null,2))'
          fi
          rm -rf android
          npx cap add android
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#2F8CF0' --iconBackgroundColorDark '#2F8CF0' --splashBackgroundColor '#2F8CF0' --splashBackgroundColorDark '#2F8CF0'
          node -e 'const fs=require("fs");const p="android/app/src/main/res/values/strings.xml";if(fs.existsSync(p)){let s=fs.readFileSync(p,"utf8");s=s.replace(/<string name="app_name">.*?<\/string>/,"<string name=\"app_name\">Sugar Pop</string>");s=s.replace(/<string name="title_activity_main">.*?<\/string>/,"<string name=\"title_activity_main\">Sugar Pop</string>");fs.writeFileSync(p,s);}'
          node -e 'const fs=require("fs");const m="android/app/src/main/AndroidManifest.xml";if(fs.existsSync(m)){let s=fs.readFileSync(m,"utf8");if(!/android:hardwareAccelerated/.test(s)){s=s.replace("<application","<application\n        android:hardwareAccelerated=\"true\"");}else{s=s.replace(/android:hardwareAccelerated="false"/g,"android:hardwareAccelerated=\"true\"");}if(/<activity\b(?![^>]*android:hardwareAccelerated)/.test(s)){s=s.replace("<activity","<activity\n            android:hardwareAccelerated=\"true\"");}fs.writeFileSync(m,s);console.log("Verified AndroidManifest hardwareAccelerated=true");}'
          npx cap sync android
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk
          ls -lh ./app-debug.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Sugar Pop APK (Build #${{ github.run_number }})
          body: |
            Sugar Pop Android Debug APK built automatically with Node 22, Java 21, and Capacitor 7.

            Download `app-debug.apk` directly from the Assets section below to install on your phone.
          files: app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

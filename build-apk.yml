name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Collect web files into www
        run: |
          mkdir -p www
          if [ -f package.json ] && grep -q '"build"' package.json; then
            npm install && npm run build
            for d in dist build; do
              if [ -f "$d/index.html" ]; then cp -r "$d"/. www/; break; fi
            done
          fi
          [ -f www/index.html ] || cp index.html www/
          ls -la www
      - name: Build Android project
        run: |
          mkdir app && cd app
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cp -r ../www ./www
          npx cap init "Sugar Pop" com.sharifprogive.sugarpop --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sugar-pop-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Sugar Pop APK ${{ github.run_number }}
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
